# The mission: what the lead is trying to accomplish and the files it must produce.
mission:
  goal: "Add a README that describes quickship"
  # Optional traceability back to stable requirement IDs in docs/PRD.md.
  requirements:
    - REQ-001
  deliverables:
    - README.md
# How the lead knows it is done: each item is checked by check_criteria.py.
success_criteria:
  - {kind: test, cmd: "bash tests/run.sh", expect: 0}
  - {kind: file, path: README.md, must_contain: "quickship"}
  - {kind: grep, pattern: "## Lead loop", path: CLAUDE.md}
  - {kind: judge, rubric: "README explains what a Mission Brief is"}
# Resource limits that stop the run when exceeded (see budget.py); stall_limit/replan_limit/critic_rounds are counts, not resources.
budgets:
  tokens: 5000000    # input + output + cache-creation tokens; cache reads are not counted. Cost and wall clock are the caps that bite
  cost_usd: 40
  wall_clock_min: 480
  steps: 400          # every tool call counts, including the subagents': a one-file mission uses ~70; keep this >= 60
  stall_limit: 3
  replan_limit: 5
  critic_rounds: 2
# What the lead may do without asking: irreversible actions default to skip-and-record unless they match an allow pattern.
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
# How the lead resolves ambiguity when it is not covered above: always pick a sensible default and write it to the ledger as an assumption.
ambiguity_policy: choose-default-and-record

quality:
  profile: docs
