name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate refuses to pass an empty tree and never uses continue-on-error:
      # the source repo's advisory and depth-limited gates stayed green while
      # checking almost nothing (docs/research/claude-skills-study.md, section 4).
      - name: Repo gate
        run: python scripts/check.py
      # Every check has a known-bad fixture that must fail; a gate that has only
      # ever passed proves nothing.
      - name: Gate self-tests
        run: python -m unittest discover -s tests -v
