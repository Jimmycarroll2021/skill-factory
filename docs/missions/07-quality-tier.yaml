mission:
  goal: "A developer can run skillz judge to have a model score with-skill and without-skill transcripts of every behaviour case against an explicit rubric, cross-model by default when both claude and codex are available, and when a runner is given skillz challenge and skillz package fold those behavioural scores into their verdicts and regressions, so the factory proves skill quality rather than only trigger wording, while every test still runs offline with fake runners"
  requirements:
    - REQ-010
  deliverables:
    - src/skill_factory/
    - tests/test_judge.py
    - tests/test_behaviour_cases.py
    - docs/evidence/
    - README.md
    - CHANGELOG.md
success_criteria:
  - {kind: test, cmd: "uv run pytest -q", expect: 0}
  - {kind: test, cmd: "uv run pytest -q tests/test_judge.py tests/test_behaviour_cases.py", expect: 0}
  - {kind: test, cmd: "uv run skillz judge --help", expect: 0}
  - {kind: test, cmd: "uv run skillz validate skill-factory", expect: 0}
  - {kind: file, path: README.md, must_contain: "skillz judge"}
  - {kind: judge, rubric: "Tests prove that case generation yields a behaviour case with a task prompt, a rubric and expected markers for every spec behaviour and trigger, deterministically; that skillz judge without a runner records skipped no runner and exits 0, and with a fake runner and fake judge produces judge.json and judge.md with per-case scores for both sides, a winner and a reason, and that a malformed judge reply is rejected with a clear error rather than a crash; that the judge defaults to the other model when both executables are found on PATH and to the same model otherwise, and the report names which; that skillz challenge with a runner counts a behaviour case the judge scores lower on the candidate as a regression and higher as an improvement, and that skillz package with a runner stores judge results in the version reports and the next regression compares them; that no test ever spawns the real claude or codex; and that docs/evidence contains a judge report produced by a real Claude CLI run whose runner field says claude"}
budgets:
  tokens: 6000000
  cost_usd: 60
  wall_clock_min: 100
  steps: 320
  stall_limit: 3
  replan_limit: 3
  critic_rounds: 2
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
ambiguity_policy: choose-default-and-record
quality:
  profile: code
  lint: "uv run ruff check src tests"
  test: "uv run pytest -q"
  build: "uv build"
