mission:
  goal: "A developer can install the skillz-factory package with uv and run skillz new with a paragraph or a small YAML or JSON spec to get a structured spec and a spec-compliant canonical skill under skills/<name>/, with CI running ruff and pytest on Linux and Windows"
  requirements:
    - REQ-001
    - REQ-008
  deliverables:
    - pyproject.toml
    - src/skillz_factory/
    - tests/test_capture.py
    - tests/test_generate.py
    - tests/fixtures/
    - LICENSE
    - .gitignore
    - .github/workflows/ci.yml
success_criteria:
  - {kind: test, cmd: "uv run pytest -q", expect: 0}
  - {kind: test, cmd: "uv run pytest -q tests/test_capture.py tests/test_generate.py", expect: 0}
  - {kind: test, cmd: "uv run skillz --help", expect: 0}
  - {kind: test, cmd: "uv run skillz new --help", expect: 0}
  - {kind: test, cmd: "uv build", expect: 0}
  - {kind: file, path: LICENSE, must_contain: "MIT License"}
  - {kind: grep, pattern: "windows-latest", path: .github/workflows/ci.yml}
  - {kind: judge, rubric: "Tests run skillz new on a real paragraph fixture and on YAML and JSON spec fixtures in a temporary directory and assert on the generated SKILL.md frontmatter: kebab-case name equal to the directory name and at most 64 characters, non-empty description at most 1024 characters, and that scripts/, references/ or assets/ appear only when the spec asks for them; pyproject.toml declares no runtime dependencies, only pytest and ruff as dev dependencies, and a skillz console script; the CI workflow runs ruff and pytest on ubuntu-latest and windows-latest"}
budgets:
  tokens: 3000000
  cost_usd: 25
  wall_clock_min: 50
  steps: 140
  stall_limit: 3
  replan_limit: 2
  critic_rounds: 1
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
ambiguity_policy: choose-default-and-record
quality:
  profile: code
  lint: "uv run ruff check src tests"
  test: "uv run pytest -q"
  build: "uv build"
