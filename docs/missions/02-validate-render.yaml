mission:
  goal: "A developer can run skillz validate to get a static structure and security verdict for a skill, and skillz render to get Claude and Codex install variants from the one canonical source, each with a JSON report and Markdown summary under skills/<name>/.factory/"
  requirements:
    - REQ-002
    - REQ-003
  deliverables:
    - src/skillz_factory/
    - tests/test_validate.py
    - tests/test_render.py
    - tests/fixtures/
success_criteria:
  - {kind: test, cmd: "uv run pytest -q", expect: 0}
  - {kind: test, cmd: "uv run pytest -q tests/test_validate.py tests/test_render.py", expect: 0}
  - {kind: test, cmd: "uv run skillz validate --help", expect: 0}
  - {kind: test, cmd: "uv run skillz render --help", expect: 0}
  - {kind: judge, rubric: "Validation tests use bad-skill fixtures and show each rule firing with a non-zero exit: wrong or overlong name, name not matching directory, empty or overlong description, files outside SKILL.md, scripts/, references/, assets/ and .factory/, oversized files, and forbidden patterns (a fake secret, a network call such as curl or urllib, destructive shell such as rm -rf) in scripts, while a clean fixture passes; nothing in the validator executes skill scripts; render tests prove the Claude variant matches the .claude/skills/<name>/ layout, the Codex variant contains agents/openai.yaml, and the canonical skill files are byte-identical before and after rendering"}
budgets:
  tokens: 4000000
  cost_usd: 35
  wall_clock_min: 70
  steps: 200
  stall_limit: 3
  replan_limit: 2
  critic_rounds: 2
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
ambiguity_policy: choose-default-and-record
quality:
  profile: code
  lint: "uv run ruff check src tests"
  test: "uv run pytest -q"
  build: "uv build"
