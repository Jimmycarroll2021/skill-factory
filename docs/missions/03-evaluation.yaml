mission:
  goal: "A developer can run skillz eval to get generated positive and negative trigger tests and behavioural cases for a skill, deterministic offline grades, weak areas with concrete improvement proposals, and an opt-in with-skill versus no-skill baseline run through the claude or codex CLI that records skipped when no runner is available"
  requirements:
    - REQ-004
  deliverables:
    - src/skill_factory/
    - tests/test_eval.py
    - tests/test_runner.py
    - tests/fixtures/
success_criteria:
  - {kind: test, cmd: "uv run pytest -q", expect: 0}
  - {kind: test, cmd: "uv run pytest -q tests/test_eval.py tests/test_runner.py", expect: 0}
  - {kind: test, cmd: "uv run skillz eval --help", expect: 0}
  - {kind: judge, rubric: "Tests show case generation is deterministic (same spec gives identical cases), positive prompts match and negative prompts do not for a well-described fixture skill, a deliberately vague description produces failing trigger cases and an improvement proposal naming them, the JSON report and Markdown summary are written under .factory/, the baseline runner is invoked only with an explicit --runner flag and an executable found on PATH (exercised through a fake runner, never the real claude or codex), and without a runner the report says skipped: no runner while the command still exits 0"}
budgets:
  tokens: 5000000
  cost_usd: 45
  wall_clock_min: 80
  steps: 240
  stall_limit: 3
  replan_limit: 2
  critic_rounds: 2
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
ambiguity_policy: choose-default-and-record
quality:
  profile: code
  lint: "uv run ruff check src tests"
  test: "uv run pytest -q"
  build: "uv build"
