mission:
  goal: "A developer can package a skill as an immutable checksummed version with a regression comparison against the last approved version, approve it explicitly, install only approved versions into the Claude or Codex project or user directory, see them in a registry of proven skills, and roll back to the previous approved version"
  requirements:
    - REQ-005
    - REQ-006
  deliverables:
    - src/skillz_factory/
    - tests/test_release.py
    - tests/test_install.py
success_criteria:
  - {kind: test, cmd: "uv run pytest -q", expect: 0}
  - {kind: test, cmd: "uv run pytest -q tests/test_release.py tests/test_install.py", expect: 0}
  - {kind: test, cmd: "uv run skillz package --help", expect: 0}
  - {kind: test, cmd: "uv run skillz approve --help", expect: 0}
  - {kind: test, cmd: "uv run skillz install --help", expect: 0}
  - {kind: test, cmd: "uv run skillz rollback --help", expect: 0}
  - {kind: test, cmd: "uv run skillz list --help", expect: 0}
  - {kind: judge, rubric: "Tests in temporary directories (HOME and USERPROFILE redirected) prove: package creates a new semver version with a SHA-256 manifest and never modifies an existing version; regression re-runs the previous approved version's cases and reports a newly failing case; install refuses an unapproved version with a non-zero exit and writes nothing; an approved install lands exactly in .claude/skills/<name>/ or .agents/skills/<name>/ (project) or the home equivalent (user) and nowhere else; registry.json records name, version, platform, scope and approval; rollback reinstalls the previous approved version without deleting any version; no code path calls git push"}
budgets:
  tokens: 6000000
  cost_usd: 60
  wall_clock_min: 100
  steps: 320
  stall_limit: 3
  replan_limit: 3
  critic_rounds: 2
permissions:
  irreversible:
    default: skip-and-record
    allow:
      - "git push origin mission/*"
      - "gh pr create*"
ambiguity_policy: choose-default-and-record
quality:
  profile: code
  lint: "uv run ruff check src tests"
  test: "uv run pytest -q"
  build: "uv build"
